name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows also runs the .NET Framework 4.8 tests (net462 build).
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          # .NET 8 runtime hosts the tests of the netstandard2.0 build.
          dotnet-version: 8.0.x
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet test --configuration Release --no-build --logger "trx" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults

  pack:
    name: Pack
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Pack
        shell: bash
        run: |
          args=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            args+=("-p:Version=${GITHUB_REF_NAME#v}")
          fi
          dotnet pack src/InfiniAnalytics --configuration Release --output artifacts "${args[@]}"
      # DLLs for hosts that cannot install NuGet packages (Power Automate Desktop, Blue Prism).
      - name: DLL bundle
        shell: bash
        run: |
          version="dev"
          args=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            args+=("-p:Version=${GITHUB_REF_NAME#v}")
            version="${GITHUB_REF_NAME#v}"
          fi
          dotnet build tools/DllBundle --configuration Release --output dll-bundle "${args[@]}"
          cd dll-bundle
          zip "../artifacts/InfiniAnalytics-${version}-dotnet-framework-dlls.zip" \
            InfiniAnalytics.dll Microsoft.Bcl.AsyncInterfaces.dll System.*.dll
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*

  github-release:
    name: GitHub release
    # Attaches the packages and the DLL bundle to a GitHub release for every v* tag, so
    # Power Automate Desktop and Blue Prism users can download the DLLs without NuGet.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" artifacts/*
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --generate-notes

  publish:
    name: Publish to NuGet
    # Runs only for v* tags and only once the repository variable NUGET_PUBLISH_ENABLED is
    # set to "true" and the secret NUGET_USER exists (Settings > Secrets and variables > Actions).
    # Uses nuget.org Trusted Publishing: no long-lived API key, the login step exchanges the
    # GitHub OIDC token for a short-lived key. The nuget.org policy is bound to this repository
    # and to ci.yml, so renaming this file breaks publishing until the policy is updated.
    # To require a manual approval before publishing, create an environment in
    # Settings > Environments, reference it here with "environment: <name>" and add the same
    # environment to the Trusted Publishing policy on nuget.org.
    if: startsWith(github.ref, 'refs/tags/v') && vars.NUGET_PUBLISH_ENABLED == 'true'
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          # nuget.org profile name (not the email address) of a member of the package owner.
          user: ${{ secrets.NUGET_USER }}
      - name: Push
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
