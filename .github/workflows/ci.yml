name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows also runs the .NET Framework 4.8 tests (net462 build).
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          # .NET 8 runtime hosts the tests of the netstandard2.0 build.
          dotnet-version: 8.0.x
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet test --configuration Release --no-build --logger "trx" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults

  pack:
    name: Pack
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Pack
        shell: bash
        run: |
          args=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            args+=("-p:Version=${GITHUB_REF_NAME#v}")
          fi
          dotnet pack src/InfiniAnalytics --configuration Release --output artifacts "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*

  publish:
    name: Publish to NuGet
    # Runs only for v* tags and only once the repository variable NUGET_PUBLISH_ENABLED is
    # set to "true" and the secret NUGET_API_KEY exists (Settings > Secrets and variables > Actions).
    # To require a manual approval before publishing, create an environment in
    # Settings > Environments and reference it here with "environment: <name>".
    if: startsWith(github.ref, 'refs/tags/v') && vars.NUGET_PUBLISH_ENABLED == 'true'
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Push
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
